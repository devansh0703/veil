name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck + tests + api bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + 115 tests
        run: npm run verify

      # api/*.js are committed build artifacts (Vercel's file tracer does not
      # follow NodeNext .ts-extension imports). If they drift from api-src/,
      # the deployed rail silently runs old code — so CI rebuilds and diffs.
      - name: Bundles match api-src/
        run: |
          npm run build:api
          git diff --exit-code -- api/ \
            || { echo "::error::api/*.js is stale — run 'npm run build:api' and commit the result"; exit 1; }

      # The pages are rendered from a fresh local run, so their addresses and
      # stamps change every generation — a byte diff would always fail. What
      # must hold is that the generator still runs and still publishes the
      # hosted rail on the surfaces that claim it.
      - name: Page generator runs and keeps the hosted link
        run: |
          npm run pages
          grep -q "hosted rail: <b>veil-devnet.vercel.app</b>" web/index.html
          grep -q "hosted rail: <b>veil-devnet.vercel.app</b>" web/limits.html

  browser:
    name: browser prover + UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the browser prover artifact
        run: npm run build:proofs

      - name: Prove in a real browser
        run: npm run prove:browser

      - name: UI checks in a real browser
        run: |
          npm run web > /tmp/veil-web.log 2>&1 &
          sleep 4
          npm run check:ui
