name: Deploy hosted rail

# Pushes to `main` deploy through Vercel's Git integration, which is why this
# workflow no longer runs on push: it deployed with a `VERCEL_TOKEN` secret that
# only lives as long as a CLI session token, so on push it went red while Vercel
# shipped the change anyway. `ci.yml` still gates every push; this file stays for
# a deliberate manual deploy, and needs a durable token (Vercel dashboard →
# Account → Tokens) in the `VERCEL_TOKEN` secret to succeed.
on:
  workflow_dispatch:

concurrency:
  group: deploy-hosted-rail
  cancel-in-progress: false

jobs:
  deploy:
    name: vercel --prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Rebuild the committed bundles so what ships matches api-src/, then let
      # Vercel's buildCommand rebuild them too (idempotent by design).
      - name: Build api bundles
        run: npm run build:api

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: latest
        run: npx vercel@latest deploy --prod --yes --scope devansh-raulos-projects --token "$VERCEL_TOKEN"
